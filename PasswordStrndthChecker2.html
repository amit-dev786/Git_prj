<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker</title>
    <style>
         *{
    padding: 0;
    margin: 0;
    font-family: consolas;
}
body{
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #333;
}
.box{
    position: relative;
    width: 300px;
    height: 50px;
    /* Added to contain the strength meter and align items */
    display: flex;
    flex-direction: column; 
    justify-content: flex-end;
}
.box h2{
    position: absolute;
    top: -40px;
    font-size: 1.25rem;
    color: #fff;
    font-weight: 500;
    white-space: nowrap;
}
.box input{
    position: absolute;
    inset: 2px;
    z-index: 10;
    font-size: 1rem;
    border: none;
    outline: none;
    padding: 10px 15px;
    background: #333;
    color: #fff;
    border-radius: 3px;
    -webkit-text-security: disc;
}

/* New container for the strength bars */
.strength-meter {
    position: absolute;
    bottom: 0; /* Position below the input field */
    left: 0;
    right: 0;
    z-index: 5;
    display: flex;
    gap: 2px; /* Small space between bars */
    height: 3px;
    background: #1115; /* Background for the empty state */
    border-radius: 5px;
    margin: 0 5px; /* Adjusting margin to align with input inset */
}

.pass_strength{
    flex: 1; /* Each bar takes up equal space */
    background: transparent; /* Default to transparent/hidden */
    border-radius: 5px;
    transition: background 0.3s ease;
}
    </style>
</head>
<body>
    <div class="box">
        <h2>Password Strength <span id="text">Check</span></h2>
        <input type="password" placeholder="Enter Password" id="pass">
        <div class="strength-meter">
            <div class="pass_strength" id="strength-bar-1"></div>
            <div class="pass_strength" id="strength-bar-2"></div>
            <div class="pass_strength" id="strength-bar-3"></div>
        </div>
    </div>
    <script>

        const text = document.querySelector("#text");
        const pass = document.querySelector("#pass");

        // Select all bars by their new unique IDs
        const strengthBar1 = document.querySelector("#strength-bar-1");
        const strengthBar2 = document.querySelector("#strength-bar-2");
        const strengthBar3 = document.querySelector("#strength-bar-3");

        pass.addEventListener("input", (event) => {
            let password = event.target.value;
            // Strength calculation: 0 = No password, 1 = Weak, 2 = Medium, 3 = Strong
            let strengthLevel = 0; 
            
            // Check for criteria to determine strength level
            if (password.length > 0) {
                strengthLevel = 1; // Base level if there's any input

                // Regex checks
                const hasLowerCase = /[a-z]/.test(password);
                const hasUpperCase = /[A-Z]/.test(password);
                const hasNumber = /[0-9]/.test(password);
                const hasSpecialChar = /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]+/.test(password);
                
                // Criteria for Medium (Level 2)
                const mediumCriteria = (hasLowerCase || hasUpperCase) && hasNumber && password.length >= 8;

                // Criteria for Strong (Level 3)
                const strongCriteria = hasLowerCase && hasUpperCase && hasNumber && hasSpecialChar && password.length >= 10;

                if (strongCriteria) {
                    strengthLevel = 3;
                } else if (mediumCriteria) {
                    strengthLevel = 2;
                }
            }


            let strengthText = '';
            let barColor = '';

            // Set text and color based on strength level
            switch(strengthLevel) {
                case 1:
                    strengthText = 'Weak';
                    barColor = '#ff2c1c'; // Red
                    break;
                case 2:
                    strengthText = 'Medium';
                    barColor = '#ff9800'; // Orange
                    break;
                case 3:
                    strengthText = 'Strong';
                    barColor = '#12ff12'; // Green
                    break;
                default:
                    strengthText = 'Check';
                    barColor = '#fff';
                    break;
            }

            // Reset all bars
            strengthBar1.style.background = 'transparent';
            strengthBar2.style.background = 'transparent';
            strengthBar3.style.background = 'transparent';
            
            // Fill bars based on strength level
            if (strengthLevel >= 1) {
                strengthBar1.style.background = barColor;
            }
            if (strengthLevel >= 2) {
                strengthBar2.style.background = barColor;
            }
            if (strengthLevel >= 3) {
                strengthBar3.style.background = barColor;
            }

            text.textContent = strengthText;
            text.style.color = barColor;
        });

    </script>
</body>
</html>
