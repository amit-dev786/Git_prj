<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker</title>
    <style>
          *{
    padding: 0;
    margin: 0;
    font-family: consolas, monospace; /* Changed font to include a common fallback */
}
body{
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #333;
}
.box{
    position: relative;
    width: 300px;
    height: 50px;
}
.box h2{
    position: absolute;
    top: -40px;
    font-size: 1.25rem;
    color: #fff;
    font-weight: 500;
    white-space: nowrap; /* Prevent "Password Strength Check" from wrapping */
}
.box input{
    position: absolute;
    inset: 2px;
    z-index: 10;
    font-size: 1rem;
    border: none;
    outline: none;
    padding: 10px 15px;
    background: #333;
    color: #fff;
    border-radius: 3px;
    /* To hide the default password dots and rely on the indicator */
    -webkit-text-security: disc;
}
/* Strength Indicator Styles */
.pass_strength {
    position: absolute;
    inset: 0;
    background: transparent; /* Default background */
    transition: all 0.5s ease;
    border-radius: 5px;
}
/* Multiple elements create a blurry glowing effect */
.pass_strength:nth-child(3) {
    filter: blur(5px);
}
.pass_strength:nth-child(4) {
    filter: blur(10px);
}
/* Colors for Strength Levels */
.weak {
    background: #ff0000; /* Red */
}
.medium {
    background: #ffae00; /* Orange */
}
.strong {
    background: #00ff00; /* Green */
}
.very_strong {
    background: #0080ff; /* Blue for very strong */
}

    </style>
</head>
<body>
    <div class="box">
        <h2 class="txt">Password Strength <span id="text">Check</span></h2>
        <input type="password" placeholder="Enter Password" id="pass">
        <div class="pass_strength"></div>
        <div class="pass_strength"></div>
        <div class="pass_strength"></div>
    </div>

    <script>
        const pass = document.getElementById('pass');
        const passStrengthIndicators = document.querySelectorAll('.pass_strength');
        const textSpan = document.getElementById('text');

        pass.addEventListener('input', () => {
            const password = pass.value;
            let strength = 0;
            let strengthText = 'Check';
            let strengthClass = '';

            // Reset indicator classes
            passStrengthIndicators.forEach(indicator => {
                indicator.className = 'pass_strength';
            });

            if (password.length > 0) {
                // Rule 1: Length (min 8)
                if (password.length >= 8) {
                    strength += 1;
                }

                // Rule 2: Uppercase/Lowercase letters
                if (password.match(/[a-z]/) && password.match(/[A-Z]/)) {
                    strength += 1;
                }

                // Rule 3: Numbers
                if (password.match(/\d/)) {
                    strength += 1;
                }

                // Rule 4: Special Characters
                if (password.match(/[^a-zA-Z\d\s]/)) { // Matches anything that isn't a letter, number, or whitespace
                    strength += 1;
                }

                // Determine strength level
                if (strength === 0) {
                    strengthText = 'Weak';
                    strengthClass = 'weak';
                } else if (strength === 1 || strength === 2) {
                    strengthText = 'Medium';
                    strengthClass = 'medium';
                } else if (strength === 3) {
                    strengthText = 'Strong';
                    strengthClass = 'strong';
                } else if (strength === 4) {
                    strengthText = 'Very Strong';
                    strengthClass = 'very_strong';
                }

                // Apply styles and text
                passStrengthIndicators.forEach(indicator => {
                    indicator.classList.add(strengthClass);
                });
                textSpan.textContent = strengthText;
            } else {
                // If password is empty
                textSpan.textContent = 'Check';
            }
        });
    </script>
</body>
</html>
