<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Get Random Colour</title>
        <style>
            #colr {
                height: 300px;
                width: 500px;
                display: flex;
                color: #fff;
                font-size: 40px;
                background-color: #000;
                justify-content: center;
                align-items: center;
                border-radius: 40px;
                border: hidden;
                box-shadow: 0 0 20px 0.5px #c8c8c8c8;
                cursor: pointer;
                margin: 20px auto;
            }

            .box {
                /* margin: 20px auto; */
                /* display: flex; */
                font-family: sans-serif;
                font-size: 20px;
                height: 50px;
                width: 150px;
                border-radius: 30px;
                border: hidden;
                background: #ffffff;
                box-shadow: 0 0 20px 0.5px #c6c7c7;
                align-items: center;
                justify-content: center;
                cursor: pointer;
            }

            .copy {
                margin: 20px auto;
                /* display: flex; */
                font-size: 20px;
                height: 50px;
                width: 150px;
                border-radius: 30px;
                border: hidden;
                background: #ffffff;
                box-shadow: 0 0 20px 0.5px #c6c7c7;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                transition: all 300ms ease-in-out;
            }

            .copied {
                font-family: sans-serif;
                font-size: 20px;
                color: #fff;
                background: #659bee;
            }

            .timeOut {
                font-family: sans-serif;
                color: #000;
                font-size: 20px;
                background: #ffffff;
            }
            
            #txt{
                align-items: center;
            }

            #container{
                margin: 10% 35%;
                height: 50vmin;
                width: 50vmin;
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                align-items: center;
                text-align: center;
            }

        </style>
    </head>

    <body>

        <div id="container">
            <div id="colr">#000000</div>
            <button class='copy' onclick="copyColor();">Copy</button>
            <button class='box' onclick='color();' >Change Color</button>
        </div>

        <script>
            const colr = document.querySelector("#colr");
            const copyBtn = document.querySelector(".copy");

            
            
            function color(){
                let  cl = [];
                const arr = ["1","2","3","4","5","6","7","8","9","0","a","b","c","d","e","f"];
                
                for (let i = 0; i <= 5; i++){
                    cl[i] = (arr[Math.floor(Math.random() * arr.length)]);
                }

                var colorCode = "#" + cl[0] + cl[1] + cl[2] + cl[3] + cl[4] + cl[5];
                colr.style.backgroundColor = colorCode;
                colr.innerText = colorCode;   
            }

            
            
            function copyColor(){

                const colour = colr.innerText;
                window.navigator.clipboard.writeText(colour);
                copyBtn.classList.remove("timeOut");
                copyBtn.classList.add("copied");
                copyBtn.innerText = "Copied!";

                setTimeout(() => {
                    copyBtn.classList.add("timeOut");
                    copyBtn.classList.remove("copied");
                    copyBtn.innerText = "Copy";
                }, 2000);
            }
        </script>
    </body>
</html>
